<!DOCTYPE html>
<html lang="uz" data-s="qish">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<title>Informatika Viktorina</title>
<style>
:root{--tx:#2a2118;--mu:#6a5f52;--pt:#fff;--bd:rgba(0,0,0,.14);--board:#2d4a3e;--chalk:#f3f1e7;--a:#d93a4a;--b:#2a6fdb;--c:#e0a40f;--d:#1f9d55;--margin:#ee9c9c;--glow:rgba(255,200,90,.7);
--sky1:#fbe7c2;--sky2:#eab16a;--card:#fffaf0;--pr:#b4501a;--pr2:#8a3b10}
[data-s=qish]{--sky1:#eaf4fd;--sky2:#a6c6ea;--card:#fff;--pr:#2a5db0;--pr2:#1b4284;--board:#27394f;--tx:#16202e;--mu:#4d5f78;--glow:rgba(255,255,255,.9)}
[data-s=yoz]{--sky1:#bfeaff;--sky2:#fff0b0;--card:#fffffa;--pr:#0b8a68;--pr2:#066650;--glow:rgba(255,214,60,.95)}
[data-s=bahor]{--sky1:#e3f7d3;--sky2:#fbd9e8;--card:#fffefc;--pr:#c4376f;--pr2:#962653;--glow:rgba(255,255,255,.8)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--sky1),var(--sky2)) fixed;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;top:-90px;right:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0,transparent 68%);z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.top,#app{position:relative;z-index:1;max-width:980px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.logo{font:700 26px "Caveat",cursive;color:var(--pr2)}
#app{padding:10px 16px 48px}
h1{font:700 clamp(34px,7vw,56px)/1.05 "Caveat",cursive;color:var(--pr2);margin:10px 0 6px}
h2{font-size:21px;font-weight:800;margin:16px 0 8px}
.mu{color:var(--mu)}
.card{background-color:var(--card);background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px,var(--margin) 42px,transparent 42px),repeating-linear-gradient(transparent 0 27px,rgba(70,110,170,.17) 27px 28px);border-radius:6px 16px 16px 6px;padding:18px 18px 18px 60px;margin:14px 0;box-shadow:0 2px 0 rgba(0,0,0,.08),0 14px 26px -16px rgba(0,0,0,.4)}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:12px 20px;background:var(--pr);color:var(--pt);font-weight:800;box-shadow:0 4px 0 var(--pr2);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pr2)}
button.g{background:var(--card);color:var(--tx);box-shadow:0 4px 0 var(--bd);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--bd);background:#fff;color:#1d1a2b;margin:6px 0}
input:focus{border-color:var(--pr);outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.grid button{padding:20px 10px;font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.role{display:flex;flex-direction:column;gap:6px;text-align:left;padding:26px 22px;font-size:26px;border-radius:18px;box-shadow:0 6px 0 var(--pr2)}
.role span{font-size:15px;font-weight:600;opacity:.9}
.role.g{box-shadow:0 6px 0 var(--bd)}
.code{font:800 clamp(52px,15vw,120px)/1 "Nunito",sans-serif;letter-spacing:.14em;text-align:center;color:var(--chalk);background:var(--board);border:10px solid #9a6b3c;border-radius:12px;padding:20px 10px 20px 24px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 16px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.opt{color:#fff;border-radius:16px;padding:22px 16px;font-size:20px;font-weight:800;text-align:left;min-height:90px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.o0{background:var(--a)}.o1{background:var(--b)}.o2{background:var(--c);color:#1d1a2b}.o3{background:var(--d)}
.opt.dim{opacity:.35}.opt.ok{outline:5px solid var(--tx)}
.q{background:var(--board);color:var(--chalk);border:10px solid #9a6b3c;border-radius:12px;padding:26px 20px;font:700 clamp(28px,5vw,44px)/1.2 "Caveat",cursive;text-align:center;margin:16px 0;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.bar{height:12px;border-radius:8px;background:rgba(0,0,0,.15);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);transition:width .5s linear}
.lb{display:flex;justify-content:space-between;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--bd);margin:8px 0;font-weight:800}
.big{font-size:60px;text-align:center}
.err{color:#b3182a;font-weight:800}
.pop{position:absolute;right:0;top:54px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:grid;gap:8px;min-width:190px;box-shadow:0 16px 30px -12px rgba(0,0,0,.4);z-index:5}
.pop[hidden]{display:none}
.pop button{text-align:left}
@media(max-width:560px){.opts,.roles{grid-template-columns:1fr}.card{padding-left:54px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#app{text-align:center}
.top{justify-content:center}
.card{text-align:left}
.row,.chips{justify-content:center}
.grid{justify-items:stretch}
.role,.opt{text-align:center;align-items:center}
.opts{max-width:860px;margin-left:auto;margin-right:auto}
.roles{max-width:760px;margin-left:auto;margin-right:auto}
#app>p.mu{margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header class="top"><span class="logo">📘 Informatika</span></header>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SYM=["▲","◆","●","■"],QT=20000;
const TOPICS={
1:["Kompyuter bilan tanishuv","Sichqoncha va klaviatura","Paint: oddiy rasm chizish","Kompyuterda xavfsiz ishlash"],
2:["Kompyuter qurilmalari","Fayl va papka","Matn yozish asoslari","Algoritm tushunchasi"],
3:["Axborot va uning turlari","Matn muharriri","Grafik muharrir","Algoritm va bajaruvchi"],
4:["Operatsion tizim","Matn muharriri (Word)","Taqdimotlar","Scratch: dasturlashga kirish"],
5:["Axborot jarayonlari","Kompyuter qurilmasi","Fayl va papkalar","Matn va grafik muharrirlar"],
6:["Axborotni kodlash","Fayl tizimi","Taqdimot yaratish","Algoritmlar","Scratch dasturlash"],
7:["Kompyuter arxitekturasi","Matnli hujjatlar","Elektron jadvallar (Excel)","Internet va xavfsizlik"],
8:["Sanoq tizimlari","Algoritm va blok-sxemalar","Python asoslari","Jadval protsessori"],
9:["Ma’lumotlar bazasi","Python: shart va sikllar","Kompyuter tarmoqlari","Veb-sahifa yaratish (HTML)"],
10:["Axborot hajmi va o‘lchov birliklari","Mantiq algebrasi","Python: ro‘yxatlar va funksiyalar","Ma’lumotlar bazasi (SQL)"],
11:["Algoritmlar murakkabligi","Veb dasturlash","Kiberxavfsizlik","Sun’iy intellekt asoslari","Loyiha ishi"]};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let roomApi=null,sampleApi=null,R=null,peers=[],S={grade:0,topic:"",qs:[],code:"",name:"",G:null,scores:{},timer:null,loc:{qi:-1,at:0,ans:null},unsub:null,err:""};

let sb=null;
function mkRoom(name){
  const key=Math.random().toString(36).slice(2,10),ch=sb.channel(name,{config:{presence:{key}}});
  let me={},cb=null;
  const emit=()=>{if(!cb)return;const st=ch.presenceState(),ps=[];for(const k in st){const l=st[k];ps.push({peer:k,isMe:k===key,presence:l[l.length-1]||{}})}cb({peers:ps})};
  ch.on("presence",{event:"sync"},emit);
  return new Promise((res,rej)=>ch.subscribe(st=>{
    if(st==="SUBSCRIBED")res({presence(p){Object.assign(me,p);for(const k in me)if(me[k]===null)delete me[k];return ch.track(me)},onPeers(f){cb=f;emit()},leave(){return sb.removeChannel(ch)}});
    else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")rej(new Error(st))}));
}
(async()=>{try{const c=await (await fetch("/api/config")).json();sb=supabase.createClient(c.url,c.key);roomApi={join:mkRoom};sampleApi=true}catch(e){}})();
home();

function home(){
  clearInterval(S.timer);
  app.innerHTML=`<h1>Informatika viktorinasi</h1><p class="mu" style="font-size:18px;max-width:560px">1–11-sinf darsliklari mavzulari bo‘yicha jonli bellashuv.</p>
  <div class="roles"><button id="m" class="role">Mentor<span>Sinf va mavzuni tanlab, o‘yinni boshqaring</span></button>
  <button id="s" class="role g">O‘quvchi<span>Kod va ismingizni yozib qo‘shiling</span></button></div>`;
  $("#m").onclick=gradeScreen;$("#s").onclick=joinScreen;
}
function gradeScreen(){
  app.innerHTML=`<h1>Sinfni tanlang</h1><div class="grid">${Object.keys(TOPICS).map(g=>`<button data-g="${g}">${g}-sinf</button>`).join("")}</div><div class="row" style="margin-top:16px"><button class="g" id="b">← Orqaga</button></div>`;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.grade=+b.dataset.g;topicScreen()});$("#b").onclick=home;
}
function topicScreen(){
  app.innerHTML=`<h1>${S.grade}-sinf: mavzuni tanlang</h1><p class="mu">Mavzular ro‘yxatini o‘zingizning darslik mazmuniga qarab tekshiring yoki o‘z mavzuingizni yozing.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${TOPICS[S.grade].map((t,i)=>`<button data-i="${i}">${esc(t)}</button>`).join("")}</div>
  <div class="card"><b>Boshqa mavzu</b><input id="ct" placeholder="Masalan: Darslik, 3-bob"><button id="cb">Davom etish</button></div>
  <button class="g" id="b">← Orqaga</button>`;
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.topic=TOPICS[S.grade][+b.dataset.i];qScreen()});
  $("#cb").onclick=()=>{const v=$("#ct").value.trim();if(v){S.topic=v;qScreen()}};$("#b").onclick=gradeScreen;
}
async function qScreen(gen){
  S.qs=S.qs||[];
  if(gen||!S.qs.length||S.qsFor!==S.grade+S.topic){S.qsFor=S.grade+S.topic;S.qs=[];
    if(sampleApi){
      app.innerHTML=`<h1>${esc(S.topic)}</h1><p class="mu">Savollar tayyorlanmoqda…</p>`;
      try{
        let pw=sessionStorage.getItem("pw");if(pw===null){pw=prompt("Mentor paroli:")||"";sessionStorage.setItem("pw",pw)}
        const resp=await fetch("/api/questions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({grade:S.grade,topic:S.topic,pass:pw})});
        if(resp.status===401)sessionStorage.removeItem("pw");
        const r=(await resp.json()).questions;
        S.qs=(Array.isArray(r)?r:[]).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length===4&&x.c>=0&&x.c<4).slice(0,12);
      }catch(e){S.err="Savollarni yaratib bo‘lmadi (parol yoki Gemini kalitini tekshiring). Qo‘lda qo‘shing."}
    }else S.err="Avtomatik yaratish mavjud emas. Savollarni qo‘lda qo‘shing.";
  }
  drawQs();
}
function drawQs(){
  app.innerHTML=`<h1>${S.grade}-sinf · ${esc(S.topic)}</h1>${S.err?`<p class="err">${esc(S.err)}</p>`:""}
  ${S.qs.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.q)}</b><div class="mu">${x.o.map((o,j)=>`${SYM[j]} ${j==x.c?"✅ ":""}${esc(o)}`).join("  ·  ")}</div><button class="g" data-d="${i}" style="margin-top:8px">O‘chirish</button></div>`).join("")||'<p class="mu">Savollar yo‘q.</p>'}
  <details class="card"><summary><b>+ Savol qo‘shish</b></summary>
  <input id="nq" placeholder="Savol matni">${[0,1,2,3].map(j=>`<input id="no${j}" placeholder="${SYM[j]} variant">`).join("")}
  <input id="nc" type="number" min="1" max="4" placeholder="To‘g‘ri variant raqami (1–4)"><button id="na">Qo‘shish</button></details>
  <div class="row"><button class="g" id="b">← Mavzular</button>${sampleApi?'<button class="g" id="rg">🔄 Qayta yaratish</button>':""}<button id="go" ${S.qs.length?"":"disabled"}>▶ O‘yinni boshlash</button></div>`;
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.qs.splice(+b.dataset.d,1);drawQs()});
  $("#na").onclick=()=>{const o=[0,1,2,3].map(j=>$("#no"+j).value.trim()),c=+$("#nc").value-1,q=$("#nq").value.trim();
    if(q&&o.every(Boolean)&&c>=0&&c<4){S.qs.push({q,o,c});S.err="";drawQs()}};
  $("#b").onclick=topicScreen;if($("#rg"))$("#rg").onclick=()=>{S.err="";qScreen(true)};$("#go").onclick=startHost;
}
async function startHost(){
  if(!roomApi){app.innerHTML=`<h1>Ulanib bo‘lmadi</h1><p class="err">Server bilan ulanib bo‘lmadi (Supabase sozlamalarini tekshiring).</p><button id="b">Orqaga</button>`;$("#b").onclick=drawQs;return}
  S.code=String(Math.floor(100000+Math.random()*900000));S.scores={};S.G={ph:"lobby",qi:-1,at:0};
  try{R=await roomApi.join("g"+S.code)}catch(e){app.innerHTML=`<p class="err">Xona ochilmadi: ${esc(e.message||e.code)}</p>`;return}
  peers=[];R.onPeers(ch=>{peers=ch.peers;hostTick(true)});
  pub();hostDraw();S.timer=setInterval(hostTick,500);
}
function students(){return peers.filter(p=>p.presence.role==="s"&&!p.isMe)}
function pub(){
  const G=S.G,q=S.qs[G.qi],sc={};
  Object.values(S.scores).forEach(v=>sc[v.n]=v.s);
  R.presence({role:"t",ph:G.ph,qi:G.qi,n:S.qs.length,q:q&&G.ph!=="lobby"?q.q:null,o:q&&G.ph!=="lobby"?q.o:null,c:G.ph==="r"&&q?q.c:null,sc,top:S.topic});
}
function hostTick(force){
  const G=S.G;if(!G)return;
  if(G.ph==="q"){const st=students(),ans=st.filter(p=>p.presence.qi===G.qi&&p.presence.a!=null).length,el=Date.now()-G.at;
    if(el>=QT||(st.length&&ans>=st.length))return reveal();
    const bar=$("#bar"),ct=$("#ct");if(bar)bar.style.width=(100-el/QT*100)+"%";if(ct)ct.textContent=`${ans}/${st.length} javob · ${Math.ceil((QT-el)/1000)} s`}
  else if(G.ph==="lobby"&&force)hostDraw();
}
function reveal(){
  const G=S.G,q=S.qs[G.qi];
  students().forEach(p=>{const x=p.presence,e=S.scores[p.peer]||(S.scores[p.peer]={n:x.name||"?",s:0});e.n=x.name||e.n;
    if(x.qi===G.qi&&x.a===q.c)e.s+=Math.round(500+500*(1-Math.min(x.t||0,QT)/QT))});
  G.ph="r";pub();hostDraw();
}
function next(){const G=S.G;if(G.qi+1>=S.qs.length){G.ph="e"}else{G.qi++;G.ph="q";G.at=Date.now()}pub();hostDraw()}
function board(n){const a=Object.values(S.scores).sort((x,y)=>y.s-x.s).slice(0,n);return a.map((e,i)=>`<div class="lb"><span>${i+1}. ${esc(e.n)}</span><span>${e.s}</span></div>`).join("")||'<p class="mu">Hali ball yo‘q</p>'}
function hostDraw(){
  const G=S.G,st=students(),q=S.qs[G.qi];
  if(G.ph==="lobby")app.innerHTML=`<p class="mu" style="text-align:center">Qo‘shilish uchun sahifani oching, “O‘quvchi” ni bosing va kodni kiriting</p><div class="code">${S.code}</div><h2>O‘quvchilar: ${st.length}</h2><div class="chips">${st.map(p=>`<span class="chip">${esc(p.presence.name)}</span>`).join("")||'<span class="mu">Kutilmoqda…</span>'}</div><div class="row" style="margin-top:20px"><button id="nx" ${st.length?"":"disabled"}>▶ Boshlash</button></div>`;
  if(G.ph==="q")app.innerHTML=`<div class="mu">Savol ${G.qi+1}/${S.qs.length} · kod ${S.code}</div><div class="bar"><i id="bar" style="width:100%"></i></div><div class="q">${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<div class="opt o${j}">${SYM[j]} ${esc(o)}</div>`).join("")}</div><p id="ct" class="mu" style="text-align:center"></p><div class="row"><button class="g" id="rv">Javoblarni ko‘rsatish</button></div>`;
  if(G.ph==="r"){const cnt=[0,0,0,0];st.forEach(p=>{if(p.presence.qi===G.qi&&p.presence.a>=0)cnt[p.presence.a]++});
    app.innerHTML=`<div class="q">${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<div class="opt o${j} ${j==q.c?"ok":"dim"}">${SYM[j]} ${esc(o)} — <b>${cnt[j]}</b></div>`).join("")}</div><h2>Reyting</h2>${board(5)}<div class="row"><button id="nx">${G.qi+1>=S.qs.length?"🏁 Yakun":"Keyingi savol →"}</button></div>`}
  if(G.ph==="e")app.innerHTML=`<div class="big">🏆</div><h1 style="text-align:center">Yakuniy reyting</h1>${board(10)}<div class="row"><button id="hm">Bosh sahifa</button></div>`;
  if($("#nx"))$("#nx").onclick=next;if($("#rv"))$("#rv").onclick=reveal;if($("#hm"))$("#hm").onclick=()=>{clearInterval(S.timer);R&&R.leave();location.reload()};
}
function joinScreen(){
  app.innerHTML=`<h1>O‘yinga qo‘shilish</h1><div class="card"><input id="cd" inputmode="numeric" maxlength="6" placeholder="6 xonali kod"><input id="nm" maxlength="20" placeholder="Ismingiz"><button id="j">Kirish</button><p id="er" class="err"></p></div><button class="g" id="b">← Orqaga</button>`;
  $("#b").onclick=home;$("#j").onclick=async()=>{
    const c=$("#cd").value.trim(),n=$("#nm").value.trim();
    if(!/^\d{6}$/.test(c)||!n){$("#er").textContent="Kod (6 raqam) va ismni kiriting";return}
    if(!roomApi){$("#er").textContent="Server bilan ulanib bo‘lmadi.";return}
    try{R=await roomApi.join("g"+c)}catch(e){$("#er").textContent="Xonaga ulanib bo‘lmadi";return}
    S.name=n;S.loc={qi:-1,at:0,ans:null};R.presence({role:"s",name:n});
    R.onPeers(ch=>{peers=ch.peers;stuDraw()});stuDraw();
  };
}
function stuDraw(){
  const T=peers.find(p=>p.presence.role==="t");
  if(!T){app.innerHTML=`<div class="big">⏳</div><h2 style="text-align:center">${esc(S.name)}, mentor kutilmoqda…</h2>`;return}
  const t=T.presence,L=S.loc,me=t.sc&&t.sc[S.name]||0;
  if(t.ph==="lobby"){app.innerHTML=`<div class="big">✅</div><h1 style="text-align:center">Siz o‘yindasiz!</h1><p class="mu" style="text-align:center">${esc(S.name)} · mentor boshlashini kuting</p>`;return}
  if(t.ph==="q"){
    if(L.qi!==t.qi){L.qi=t.qi;L.at=performance.now();L.ans=null}
    if(L.ans!==null||L.shown===t.qi)return;L.shown=t.qi;
    app.innerHTML=`<div class="mu">Savol ${t.qi+1}/${t.n}</div><div class="q">${esc(t.q)}</div><div class="opts">${t.o.map((o,j)=>`<button class="opt o${j}" data-a="${j}">${SYM[j]} ${esc(o)}</button>`).join("")}</div>`;
    app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{L.ans=+b.dataset.a;R.presence({qi:t.qi,a:L.ans,t:Math.round(performance.now()-L.at)});
      app.innerHTML=`<div class="big">📨</div><h2 style="text-align:center">Javob yuborildi</h2><div class="opts" style="grid-template-columns:1fr"><div class="opt o${L.ans}" style="text-align:center">${SYM[L.ans]}</div></div>`});
  }
  if(t.ph==="r"){const ok=L.ans===t.c;app.innerHTML=`<div class="big">${L.ans===null?"⏱️":ok?"🎉":"😕"}</div><h1 style="text-align:center">${L.ans===null?"Javob berilmadi":ok?"To‘g‘ri!":"Noto‘g‘ri"}</h1><p class="mu" style="text-align:center">To‘g‘ri javob: ${SYM[t.c]} ${esc(t.o[t.c])}</p><div class="lb"><span>Sizning ballingiz</span><span>${me}</span></div>`}
  if(t.ph==="e"){const a=Object.entries(t.sc||{}).sort((x,y)=>y[1]-x[1]),r=a.findIndex(x=>x[0]===S.name)+1;
    app.innerHTML=`<div class="big">🏆</div><h1 style="text-align:center">O‘yin tugadi</h1><div class="lb"><span>O‘rningiz</span><span>${r||"–"}/${a.length}</span></div><div class="lb"><span>Ball</span><span>${me}</span></div>`}
}

/* ===== Fasl mavzulari ===== */
const SEAS={kuz:"🍂 Kuz",qish:"❄️ Qish",yoz:"☀️ Yoz",bahor:"🌸 Bahor"};
const cv=$("#fx"),cx=cv.getContext("2d"),FX={raf:0,ps:[],s:"",w:0,h:0};
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mk(s,top){const w=FX.w,h=FX.h,p={x:Math.random()*w,y:top?-20:Math.random()*h,ph:Math.random()*6.28,rot:Math.random()*6.28};
  if(s==="qish"){p.r=1.5+Math.random()*3.5;p.vy=.5+p.r*.22;p.sw=.6;p.vr=0}
  if(s==="kuz"){p.r=6+Math.random()*6;p.vy=.7+Math.random()*1;p.sw=1.2;p.vr=(Math.random()-.5)*.05;p.col=pick(["#c2410c","#d97706","#b91c1c","#ca8a04","#9a3412"])}
  if(s==="bahor"){p.r=4+Math.random()*3;p.vy=.5+Math.random()*.8;p.sw=1;p.vr=(Math.random()-.5)*.04;p.col=pick(["#f9a8c9","#fbcfe8","#ffffff","#f472b6"])}
  if(s==="yoz"){p.r=3+Math.random()*6;p.vy=-(.15+Math.random()*.4);p.sw=.5;p.vr=0;if(top)p.y=h+10}
  return p}
function draw(){
  const s=FX.s;cx.clearRect(0,0,FX.w,FX.h);
  for(const p of FX.ps){
    p.ph+=.02;p.y+=p.vy;p.x+=Math.sin(p.ph)*p.sw;p.rot+=p.vr;
    if(s==="yoz"?p.y<-20:p.y>FX.h+20){Object.assign(p,mk(s,true))}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
    if(s==="qish"){cx.fillStyle="rgba(255,255,255,.92)";cx.beginPath();cx.arc(0,0,p.r,0,6.283);cx.fill()}
    else if(s==="yoz"){const g=cx.createRadialGradient(0,0,0,0,0,p.r*2.2);g.addColorStop(0,"rgba(255,225,90,.75)");g.addColorStop(1,"rgba(255,225,90,0)");cx.fillStyle=g;cx.beginPath();cx.arc(0,0,p.r*2.2,0,6.283);cx.fill()}
    else if(s==="kuz"){cx.fillStyle=p.col;cx.beginPath();cx.ellipse(0,0,p.r*1.5,p.r*.8,0,0,6.283);cx.fill();cx.strokeStyle="rgba(0,0,0,.25)";cx.beginPath();cx.moveTo(-p.r*1.5,0);cx.lineTo(p.r*1.5,0);cx.stroke()}
    else{cx.fillStyle=p.col;cx.globalAlpha=.9;cx.beginPath();cx.ellipse(0,0,p.r*1.3,p.r*.7,0,0,6.283);cx.fill()}
    cx.restore()}
  if(!still)FX.raf=requestAnimationFrame(draw)}
function sizeFx(){const d=devicePixelRatio||1;FX.w=innerWidth;FX.h=innerHeight;cv.width=FX.w*d;cv.height=FX.h*d;cx.setTransform(d,0,0,d,0,0)}
function startFx(s){cancelAnimationFrame(FX.raf);FX.s=s;sizeFx();
  const n=Math.min(70,Math.floor(FX.w/16));FX.ps=Array.from({length:n},()=>mk(s,false));draw()}
function setSeason(s){
  if(!SEAS[s])s="kuz";
  document.documentElement.dataset.s=s;try{localStorage.setItem("season",s)}catch(e){}
  startFx(s)}
addEventListener("resize",()=>{sizeFx()});
setSeason("qish");
</script>
